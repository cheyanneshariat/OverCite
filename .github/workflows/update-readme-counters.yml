name: Update README counters

on:
  workflow_dispatch:
  schedule:
    - cron: "21 14 * * *"

permissions:
  contents: write

jobs:
  update-vscode-installs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update VS Code install count
        run: node scripts/update-readme-vscode-installs.mjs

      - name: Commit README counter update
        run: |
          if git diff --quiet -- README.md; then
            echo "README counters are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README VS Code install count"
          git push
